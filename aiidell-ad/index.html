<!doctype html>
<html><head><meta charset="utf-8"><title>AiiDell Ad</title>
<style>
@font-face{font-family:'Fredoka';src:url('fonts/Fredoka.ttf');font-weight:300 700;}
@font-face{font-family:'Poppins';src:url('fonts/Poppins-Regular.ttf');font-weight:400;}
@font-face{font-family:'Poppins';src:url('fonts/Poppins-SemiBold.ttf');font-weight:600;}
@font-face{font-family:'Poppins';src:url('fonts/Poppins-Bold.ttf');font-weight:700;}
@font-face{font-family:'Playfair';src:url('fonts/PlayfairDisplay.ttf');font-weight:400 900;}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="cv" width="1080" height="1920"></canvas>
<script>window.VARIANT = new URLSearchParams(location.search).get("variant") || "men";</script>
<script src="src/core.js"></script>
<script src="src/characters.js"></script>
<script src="src/variant.js"></script>
<script src="src/props.js"></script>
<script src="src/scenes.js"></script>
<script>
const cv=document.getElementById('cv'); const ctx=cv.getContext('2d');
window.fontsReady = Promise.all([
 document.fonts.load('700 40px Fredoka'),document.fonts.load('600 40px Fredoka'),
 document.fonts.load('400 40px Poppins'),document.fonts.load('600 40px Poppins'),document.fonts.load('700 40px Poppins'),
 document.fonts.load('700 40px Playfair'),document.fonts.load('italic 400 40px Playfair'), loadRecFrames()]).then(()=>true);
window.renderFrame = t => { ctx.save(); renderScene(ctx, t); ctx.restore(); return true; };
const q=new URLSearchParams(location.search); if(q.get('t')) fontsReady.then(()=>renderFrame(parseFloat(q.get('t'))));
</script></body></html>
