<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aiidell Diwali Greeting</title>
<style>
  :root{--gold:#ffc83d;--amber:#ff8a1f;--deep:#12062b;--rose:#ff4f8b}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#000;overflow:hidden;font-family:Georgia,'Times New Roman',serif}
  .stage{position:relative;height:100vh;aspect-ratio:9/16;max-width:100vw;margin:0 auto;
    background:radial-gradient(ellipse at 50% 85%,#4a1368 0%,var(--deep) 60%,#05010f 100%);overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:6%}
  .logo{width:34%;max-height:14%;object-fit:contain;opacity:0;animation:rise 1.2s .3s forwards}
  .wordmark{font-family:system-ui,sans-serif;font-weight:800;letter-spacing:.12em;font-size:clamp(22px,4.2vh,44px);
    color:var(--gold);opacity:0;animation:rise 1.2s .3s forwards;display:none}
  h1{font-size:clamp(40px,9vh,96px);line-height:1;margin:3vh 0 1.5vh;color:var(--gold);
    text-shadow:0 0 24px rgba(255,160,40,.7);opacity:0;animation:rise 1.4s 1.2s forwards}
  h2{font-weight:400;font-style:italic;font-size:clamp(16px,3vh,32px);color:#ffe9b8;opacity:0;animation:rise 1.4s 2s forwards}
  .tag{font-family:system-ui,sans-serif;font-size:clamp(11px,1.8vh,18px);letter-spacing:.2em;text-transform:uppercase;
    color:#ffd88a;margin-top:3vh;opacity:0;animation:rise 1.4s 2.8s forwards}
  .diyas{position:absolute;bottom:4%;left:0;right:0;display:flex;justify-content:space-around;padding:0 8%}
  .diya{width:15%;opacity:0;animation:rise 1s forwards}
  .diya:nth-child(1){animation-delay:3.2s}.diya:nth-child(2){animation-delay:3.5s}
  .diya:nth-child(3){animation-delay:3.8s}.diya:nth-child(4){animation-delay:4.1s}.diya:nth-child(5){animation-delay:4.4s}
  .flame{transform-origin:50% 100%;animation:flick .5s infinite alternate}
  @keyframes flick{from{transform:scale(1,.92) rotate(-2deg)}to{transform:scale(.94,1.06) rotate(2deg)}}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .replay{position:fixed;top:10px;right:10px;font:12px system-ui;padding:6px 10px;border-radius:8px;border:0;background:#ffffff30;color:#fff;cursor:pointer;z-index:5}
</style>
</head>
<body>
<button class="replay" onclick="location.reload()">Replay</button>
<div class="stage">
  <canvas id="fx"></canvas>
  <div class="content">
    <!-- Drop your logo at aiidell-diwali/logo.png; falls back to the text wordmark if missing -->
    <img class="logo" src="logo.png" alt="Aiidell" onerror="this.style.display='none';document.querySelector('.wordmark').style.display='block'">
    <div class="wordmark">AIIDELL</div>
    <h1>Happy<br>Diwali</h1>
    <h2>May light brighten every corner of your year</h2>
    <div class="tag">Warm wishes from Aiidell</div>
  </div>
  <div class="diyas" id="diyas"></div>
</div>
<script>
// diyas
const diya=`<svg class="diya" viewBox="0 0 100 80"><defs><radialGradient id="g" cx="50%" cy="80%" r="60%"><stop offset="0" stop-color="#fff6b0"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/></radialGradient></defs>
<circle cx="50" cy="26" r="26" fill="url(#g)"/>
<path class="flame" d="M50 4C60 18 62 26 50 38C38 26 40 18 50 4Z" fill="#ffb02e"/>
<path class="flame" d="M50 16C55 24 55 29 50 35C45 29 45 24 50 16Z" fill="#fff3b0"/>
<path d="M8 44H92C90 66 72 76 50 76C28 76 10 66 8 44Z" fill="#c4521a"/>
<path d="M8 44H92C88 52 70 56 50 56C30 56 12 52 8 44Z" fill="#e8742a"/></svg>`;
document.getElementById('diyas').innerHTML=diya.repeat(5);

// fireworks + sparkles
const c=document.getElementById('fx'),x=c.getContext('2d');
function size(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio}
size();addEventListener('resize',size);
const P=[],cols=['#ffc83d','#ff8a1f','#ff4f8b','#fff3b0','#b98cff'];
function burst(px,py){const col=cols[Math.random()*cols.length|0];
  for(let i=0;i<70;i++){const a=Math.random()*6.283,s=1+Math.random()*4.5;
    P.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,col})}}
function launch(){burst((.15+Math.random()*.7)*c.width,(.1+Math.random()*.4)*c.height)}
setInterval(launch,900);setTimeout(launch,300);
function loop(){
  x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.18)';x.fillRect(0,0,c.width,c.height);
  x.globalCompositeOperation='lighter';
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx*devicePixelRatio;p.y+=p.vy*devicePixelRatio;
    p.vy+=.05;p.vx*=.985;p.l-=.011;
    if(p.l<=0){P.splice(i,1);continue}
    x.globalAlpha=p.l;x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,2.2*devicePixelRatio,0,6.283);x.fill()}
  x.globalAlpha=1;requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
